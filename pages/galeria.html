<!DOCTYPE html>

    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <script>
            document.addEventListener('contextmenu', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                }
            });
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                }
            });
        </script>
        <div class="nav-container">
            <div class="nav-logo"><a href="../index.html">Mariángel Mujica</a></div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="/pages/sobre-mi.html" class="nav-link">Sobre Mí</a></li>
                <li><a href="/pages/servicios.html" class="nav-link">Servicios</a></li>
                <li><a href="/pages/galeria.html" class="nav-link active">Galería</a></li>
                <li><a href="/pages/cursos.html" class="nav-link">Cursos</a></li>
                <li><a href="/pages/recursos.html" class="nav-link">Recursos</a></li>
                <li><a href="/pages/revista.html" class="nav-link">Revista</a></li>
                <li><a href="/pages/clientes.html" class="nav-link">Clientes</a></li>
                <li><a href="/pages/contacto.html" class="nav-link">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="page-header-content">
            <h1 class="page-title"><span class="highlight">Galería</span></h1>
            <p class="page-subtitle">Eventos por todo el mundo.</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="page-content">
        <!-- Gallery Grid: Card de eventos con portada -->
        <section class="gallery-full-section" style="margin-top:64px;display:flex;justify-content:center;align-items:flex-start;min-height:340px;">
            <div class="gallery-item" style="max-width:600px;width:100%;margin:auto;box-shadow:0 6px 32px 0 rgba(0,0,0,0.18);border-radius:22px;overflow:hidden;position:relative;">
                <a href="/galeria/eventos" style="display:block;text-decoration:none;position:relative;width:100%;">
                    <img src="/models/PORTADAGALLERY.jpg" alt="Portada Galería" style="width:100%;display:block;object-fit:cover;">
                    <div class="gallery-overlay" style="position:absolute;bottom:0;left:0;width:100%;background:linear-gradient(0deg,rgba(10,14,39,0.85) 70%,rgba(10,14,39,0.15) 100%);padding:38px 0 22px 0;text-align:center;">
                                                <span class="gallery-link" style="font-size:1.2rem;font-weight:bold;">Ver fotos de eventos →</span>
                                        </div>
                                </a>
                        </div>
                </section>

<style>
.gallery-overlay {
    background: linear-gradient(0deg,rgba(163,230,53,0.45) 70%,rgba(163,230,53,0.07) 100%) !important;
}
</style>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <!-- El footer se incluirá automáticamente -->
    <script src="../js/footer.js"></script>
