<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="../models/MM 2025 2.png">

    <style>
        .contact-page {
            min-height: 100vh;
            padding: 120px var(--spacing-md) 80px;
            background: #000000;
        }

        .contact-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .contact-form {
            background: linear-gradient(135deg, #0a0a0a 0%, rgba(15, 15, 15, 0.8) 100%);
            padding: 40px;
            border: 1px solid rgba(163, 230, 53, 0.15);
            border-radius: 16px;
            margin-bottom: 80px;
            animation: slideUp 0.8s ease-out;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(163, 230, 53, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            font-family: inherit;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #a3e635;
            background: rgba(163, 230, 53, 0.05);
            box-shadow: 0 0 20px rgba(163, 230, 53, 0.2);
        }

        .form-textarea {
            min-height: 140px;
            resize: vertical;
            font-family: inherit;
        }

        .form-submit {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #a3e635 0%, #8bc83d 100%);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(163, 230, 53, 0.3);
        }

        .form-submit:active {
            transform: translateY(-1px);
        }

        .contact-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .info-card {
            background: linear-gradient(135deg, #0a0a0a 0%, rgba(15, 15, 15, 0.8) 100%);
            padding: 32px 24px;
            border: 1px solid rgba(163, 230, 53, 0.15);
            border-radius: 12px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .info-card:hover {
            border-color: #a3e635;
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(163, 230, 53, 0.2);
        }

        .info-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: block;
        }

        .info-title {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .info-text {
            color: #8b92b0;
            font-size: 0.95rem;
        }
    </style>
</head>

    <main class="contact-page">
        <div class="contact-container">
            <div style="margin-bottom: 60px; text-align: center;">
                <h1 style="font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #fff 0%, #a3e635 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Contacto</h1>
                <p style="font-size: 1.1rem; color: #8b92b0; margin: 0;">¿Tienes un proyecto en mente? Conversemos sobre tus ideas</p>
            </div>

            <form class="contact-form" id="contactForm" action="../enviar.php" method="POST">
                <div class="form-group">
                    <label for="fullname" class="form-label">Nombre Completo</label>
                    <input type="text" id="fullname" name="fullname" class="form-input" placeholder="Tu nombre completo" required>
                </div>
                <div class="form-group">
                    <label for="country" class="form-label">País</label>
                    <input type="text" id="country" name="country" class="form-input" placeholder="Tu país" required>
                </div>
                <div class="form-group">
                    <label for="company" class="form-label">Empresa</label>
                    <input type="text" id="company" name="company" class="form-input" placeholder="Nombre de tu empresa" required>
                </div>
                <div class="form-group">
                    <label for="instagram" class="form-label">Link de Instagram</label>
                    <input type="url" id="instagram" name="instagram" class="form-input" placeholder="https://instagram.com/tuusuario" required>
                </div>
                <button type="submit" class="form-submit">Enviar Mensaje</button>
            </form>

            <div class="contact-info-grid">
                <div class="info-card">
                    <span class="info-icon">📧</span>
                    <h3 class="info-title">Email</h3>
                    <p class="info-text">isthebigleap@gmail.com</p>
                </div>

                <div class="info-card">
                    <span class="info-icon">📱</span>
                    <h3 class="info-title">Teléfono</h3>
                    <p class="info-text">+58 414-5364028</p>
                </div>
            </div>
        </div>
    </main>
