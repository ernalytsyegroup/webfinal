<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Webinar | Mariángel Mujica</title>
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/pages.css">
    <style>
        body { background: var(--bg, #05060a); color: #fff; font-family: Inter, system-ui, Arial; }
        .register-card { max-width: 420px; margin: 48px auto; background: rgba(24,24,24,0.98); border-radius: 28px; box-shadow: 0 8px 40px 0 rgba(163,230,53,0.13),0 1.5px 12px 0 rgba(163,230,53,0.10); padding: 48px 32px; }
        h1 { color: var(--accent); font-size: 2em; margin-bottom: 18px; font-weight: 900; text-align: center; }
        form { display: flex; flex-direction: column; gap: 18px; }
        input { padding: 12px 14px; border-radius: 8px; border: 1.5px solid #222; background: #181818; color: #fff; font-size: 1em; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input[name="codigo_pais"] { width: 90px; padding: 12px 10px; }
        .input-row input[name="celular"] { flex: 1; padding: 12px 14px; }
        button[type="submit"] { margin-top: 10px; background: var(--accent); color: #181818; font-weight: 900; font-size: 1.1em; padding: 14px 0; border-radius: 8px; border: none; cursor: pointer; box-shadow: 0 2px 12px var(--accent); }
        @media (max-width: 600px) { .register-card { padding: 24px 8px; } }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>¡Haz tu RESET ahora!</h1>
        <form id="registerForm">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <div class="input-row">
                <input type="tel" name="codigo_pais" placeholder="Código país (+58)" required>
                <input type="tel" name="celular" placeholder="Celular" required>
            </div>
            <input type="text" name="pais" placeholder="País" required>
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <button type="submit">Registrarme</button>
        </form>
    </div>
    <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.body.innerHTML = `<div class='register-card'><h1>¡Registro confirmado!</h1><p>Gracias por registrarte. Pronto recibirás información en tu correo.</p><a href='../webinar.html' style='display:inline-block;margin-top:24px;color:var(--accent);font-weight:700;text-decoration:underline;'>Volver al webinar</a></div>`;
    });
    </script>
</body>
</html>
